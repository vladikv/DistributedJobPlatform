spring.application.name=worker-service

server.port=8082

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=worker-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.value.default.type=com.distributedjobplatform.workerservice.event.JobCreatedEvent

spring.datasource.url=jdbc:postgresql://localhost:5434/distributed_job_platform
spring.datasource.username=jobplatform
spring.datasource.password=jobplatform

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=worker-service

management.opentelemetry.tracing.export.otlp.endpoint=http://tempo:4318/v1/traces
management.tracing.sampling.probability=1.0