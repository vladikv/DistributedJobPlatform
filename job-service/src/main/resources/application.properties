spring.application.name=job-service

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5434/distributed_job_platform
spring.datasource.username=jobplatform
spring.datasource.password=jobplatform

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=job-service

management.opentelemetry.tracing.export.otlp.endpoint=http://tempo:4318/v1/traces
management.tracing.sampling.probability=1.0

# Kafka producer timeouts: fail fast instead of blocking for 60 seconds
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=3000

# Retry policy for publishing events
resilience4j.retry.instances.kafkaPublish.max-attempts=3
resilience4j.retry.instances.kafkaPublish.wait-duration=500ms
resilience4j.retry.instances.kafkaPublish.enable-exponential-backoff=true
resilience4j.retry.instances.kafkaPublish.exponential-backoff-multiplier=2


# Circuit breaker for Kafka publishing
resilience4j.circuitbreaker.instances.kafkaPublish.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.kafkaPublish.sliding-window-size=6
resilience4j.circuitbreaker.instances.kafkaPublish.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.kafkaPublish.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafkaPublish.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.kafkaPublish.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.kafkaPublish.automatic-transition-from-open-to-half-open-enabled=true

# Do not retry when the circuit breaker has already rejected the call
resilience4j.retry.instances.kafkaPublish.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException